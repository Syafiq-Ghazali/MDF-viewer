[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mdf-waveform-viewer"
version = "0.1.0"
description = "Interactive MDF waveform viewer for embedded firmware debugging"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "pyqtgraph>=0.14,<0.15",
    "asammdf>=8.7,<9",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
mdf-viewer = "mdf_viewer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
